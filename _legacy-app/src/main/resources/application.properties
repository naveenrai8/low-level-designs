# Application Configuration
spring.application.name=learning-systems
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.learning=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Thread Configuration (for virtual threads)
spring.threads.virtual.enabled=true
